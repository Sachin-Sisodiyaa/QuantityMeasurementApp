spring:
  config:
    import:
      - optional:file:../secrets/app-secrets.properties
      - optional:file:../secrets/oauth-secrets.properties
      - optional:file:../secrets/db-secrets.properties
  datasource:
    url: ${AUTH_DB_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${AUTH_DB_DRIVER:org.h2.Driver}
    username: ${AUTH_DB_USERNAME:sa}
    password: ${AUTH_DB_PASSWORD:}
  jpa:
    database-platform: ${AUTH_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:local-dev-jwt-secret-change-me-1234567890}
  oauth2:
    redirect-uri: ${AUTH_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth-success}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
