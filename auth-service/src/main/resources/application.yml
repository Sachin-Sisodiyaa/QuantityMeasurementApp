server:
  port: 8081
  forward-headers-strategy: framework

spring:
  profiles:
    default: local
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL}
    driver-class-name: ${AUTH_DB_DRIVER}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    database-platform: ${AUTH_JPA_DIALECT}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-minutes: ${AUTH_JWT_EXPIRATION_MINUTES:60}
  oauth2:
    redirect-uri: ${AUTH_OAUTH2_REDIRECT_URI}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=https://qma-eureka-server-k1sl.onrender.com/eureka/}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
